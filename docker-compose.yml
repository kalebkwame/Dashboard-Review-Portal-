services:
  portal:
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: "sqlite:///./data/dashboard_review.db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      ADMIN_SETUP_KEY: "${ADMIN_SETUP_KEY}"
      APP_ENV: "production"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8001}"
    volumes:
      - portal_data:/app/data

volumes:
  portal_data:
