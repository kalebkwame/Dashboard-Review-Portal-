<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/static/professional.css">
  <style>
    body{margin:0;background:#eef2f7;color:#17233c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:420px;margin:90px auto;background:#fff;border:1px solid #d9e1ec;border-radius:12px;padding:28px}.card h1{margin-top:0}.card label{display:block;margin:16px 0 6px;font-weight:700}.card input{width:100%;height:44px;border:1px solid #bcc7d6;border-radius:7px;padding:10px}.card button{width:100%;height:44px;margin-top:18px;border:0;border-radius:7px;background:#3973df;color:#fff;font-weight:700}.error{color:#b42318}.success{color:#247b55}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset password</h1>
    <form id="resetForm">
      <label>New password</label>
      <input id="newPassword" type="password" minlength="8" maxlength="128" required>
      <p id="resetMessage"></p>
      <button type="submit">Update password</button>
    </form>
  </main>
  <script src="/static/reset-password.js"></script>
</body>
</html>
