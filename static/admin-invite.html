<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Admin Account</title>
  <style>
    :root{--ink:#17233c;--line:#d9e1ec;--brand:#3973df;--canvas:#eef2f7}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .card{max-width:420px;margin:90px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 3px 12px rgba(23,35,60,.06)}
    h1{margin:0 0 8px;font-size:24px}.muted{color:#68758a;font-size:13px}label{display:block;margin:16px 0 6px;font-weight:700;font-size:13px}input,button{width:100%;font:inherit;border-radius:7px}input{border:1px solid #bcc7d6;padding:11px}button{border:0;margin-top:18px;padding:12px;background:var(--brand);color:#fff;font-weight:700}.error{color:#b42318}.success{color:#247b55}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Create admin account</h1>
    <p id="invitationEmail" class="muted"></p>
    <form id="inviteForm">
      <label>Name</label><input id="inviteName" required minlength="2" maxlength="100">
      <label>Password</label><input id="invitePassword" type="password" required minlength="8" maxlength="128">
      <p id="inviteMessage"></p>
      <button type="submit">Create admin account</button>
    </form>
  </main>
  <script src="/static/admin-invite.js"></script>
</body>
</html>
